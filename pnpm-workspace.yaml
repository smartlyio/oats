packages:
  - packages/*

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@smartly/*"
  # Renovate security update: lodash@4.18.1
  - lodash@4.18.1

# Supply chain hardening (see https://pnpm.io/settings)
engineStrict: true

# Avoid non-TTY module purge prompts during pnpm runtime dependency checks.
verifyDepsBeforeRun: false

# Install/postinstall scripts run only for explicitly allowlisted packages.
strictDepBuilds: true
allowBuilds: { '@swc/core': true, esbuild: true }

# Transitive deps must resolve from the registry, not git/tarball URLs.
blockExoticSubdeps: true

resolutionMode: highest

packageExtensions:
  '@typescript-eslint/eslint-plugin':
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
  '@typescript-eslint/type-utils':
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
  '@typescript-eslint/typescript-estree':
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
  tsutils:
    dependencies:
      typescript: 'npm:@typescript/typescript6@^6.0.2'
